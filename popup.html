<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AliExpress Photo Downloader</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 12px;
        min-width: 260px;
      }

      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px;
        background: #ff4747;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      p {
        font-size: 12px;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>AliExpress Photo Downloader</h1>
    <button id="download-main" type="button">Baixar foto principal</button>
    <p id="status">Abra a página do produto e clique no botão acima.</p>
    <script src="popup.js"></script>
  </body>
</html>
